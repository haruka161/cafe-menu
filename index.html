<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">
<div class="w-80 bg-white rounded-lg shadow overflow-hidden">
    <h1 class="bg-stone-300 text-green-600 font-bold  text-center p-3 text-3xl">Menu</h1>
    <div class="p-6">
        <h2 class="text-green-600 font-bold text-xl">Drinks</h2>
        <ul class="text-gray-700 font-normal">
            <li>コーヒー <span class="font-normal text-sm text-gray-500">¥300</span></li>
            <li>紅茶 <span class="font-normal text-sm text-gray-500">¥250</span></li>
            <li>りんごジュース <span class="font-normal text-sm text-gray-500">¥200</span></li>
        </ul>
    </div>
    <div class="px-6">
        <h2 class="text-green-600 font-bold text-xl hover:bg-stone-200">Foods</h2>
        <ul class="text-gray-700 font-normal">
            <li>サンドイッチ <span class="font-normal text-sm text-gray-500">¥400</span></li>
            <li>オムライス <span class="font-normal text-sm text-gray-500">¥600</span></li>
            <li>サラダ <span class="font-normal text-sm text-gray-500">¥300</span></li>
        </ul>
    </div>
    <div class="p-6">
        <h2 class="text-green-600 font-bold text-xl hover:bg-stone-300">Cakes</h2>
        <ul class="text-gray-700 font-normal">
            <li>モンブラン<span class="font-normal text-sm text-gray-500">¥600</span></li>
            <li>チョコレートケーキ <span class="font-normal text-sm text-gray-500">¥500</span></li>
        </ul>
    </div>
</div>
</body>
</html>
